name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned to match the image. The dev-only `anki` wheels are
          # manylinux_2_35 and cp310-abi3, so the runner's glibc matters too.
          python-version: "3.12"

      # testcontainers starts its own Postgres, so nothing is declared as a
      # service here -- the suite is responsible for its own database and runs
      # the same way on a laptop as it does here.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The pg_dump tests skip without a client, and skipping them in CI too
      # would mean the backup path is never exercised anywhere automatically.
      # Client 17 because pg_dump refuses to dump a server newer than itself.
      - name: Postgres client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          pg_dump --version

      - name: Tests
        run: python -m pytest -q

  fly-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Strict, not plain. Plain validation silently accepts unrecognised keys,
      # so a typo'd `auto_stop_machines` would pass here, do nothing in
      # production, and let the machine stop itself under a running job.
      - name: Validate fly.toml
        run: fly config validate --strict

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ai-anki:ci .

      # LibreOffice only exists in the image, so the conversion tests skip
      # locally and must run here. The concurrent-batch test is the one that
      # matters: with a shared user profile it produces a couple of PDFs and
      # several silent exit-1s, and nothing else in the suite would notice.
      - name: Container-only tests
        run: |
          docker run --rm -v "$PWD/tests:/app/tests:ro" ai-anki:ci \
            sh -c "pip install -q pytest pytest-asyncio anki==26.8.1 && \
                   cd /app && python -m pytest tests/test_conversion.py tests/test_occlusion.py -q -p no:cacheprovider"
