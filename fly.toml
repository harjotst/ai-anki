app = "ai-anki"
primary_region = "lhr"

# These must sit above every table header. TOML assigns bare keys to the most
# recent table, so placing them at the foot of the file would silently make them
# `[[vm]]` keys — accepted, ignored, and the drain would never get its window.
#
# SIGTERM is what the drain listens for. kill_timeout is the outer bound the
# platform allows before SIGKILL: a drain window, not a "finish your work"
# timer, which is why jobs checkpoint and resume rather than relying on it.
kill_signal = "SIGTERM"
kill_timeout = "300s"

[build]

# Migrations run once per deploy, before any new machine starts, rather than
# from inside the application's own boot. Boot is the wrong place: it runs on
# every restart, including the ones the platform causes, and two machines
# booting together would race each other through the same migration.
[deploy]
  release_command = "alembic upgrade head"

[env]
  AI_ANKI_DATA_DIR = "/data/uploads"
  TMPDIR = "/data/tmp"

# Uploads and the conversion scratch space live here. The database does not —
# it is managed Postgres now, which is what makes losing this volume cost a
# re-upload rather than everything.
[[mounts]]
  source = "ai_anki_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # A job runs for minutes after its request has returned. Auto-stopping on idle
  # HTTP would kill it part-way through, so the machine stays up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options]
    # The progress stream heartbeats every 15s but a single topic call can go a
    # long time with nothing to report. The default idle timeout would cut the
    # connection; this outlasts any gap the stream can produce.
    idle_timeout = 600

[[vm]]
  # One conversion peaks around 218MB, measured. 256MB would OOM on a single
  # file; 1GB leaves room for a couple at once plus the application itself.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
