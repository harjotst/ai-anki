# The database URL is deliberately absent. It is a runtime secret and is read
# from AI_ANKI_DATABASE_URL in env.py, so that a copy of this repository never
# contains a way into anybody's data.
[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
