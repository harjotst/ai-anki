[project]
name = "ai-anki"
version = "0.1.0"
description = "Turn study documents into Anki decks whose structure scales with the material"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
    "anthropic>=0.40",
    "openai>=3.3",
    # OpenAI has no token-counting endpoint; the admission gate counts text
    # locally with the o200k tokenizer family and estimates documents by page.
    "tiktoken>=0.14",
    # Pinned exactly: genanki is semi-dormant (last release 2023-11-12) and we
    # work around a known defect in this version rather than waiting on a fix.
    # See docs/verification.md.
    "genanki==0.13.1",
    # Spreadsheets are read as tables rather than rendered to pages.
    "openpyxl>=3.1",
    # Image Occlusion rasterizes diagram pages locally. It has to be local:
    # pages rasterized by the API come back at dimensions we cannot know, and a
    # mask drawn against unknown dimensions lands in the wrong place.
    "pypdfium2>=4.30",
    "pillow>=10.0",
    # The datastore. Binary wheel so the image needs no build toolchain; the
    # `pg_dump` the backup shells out to comes from the postgresql-client
    # package in the Dockerfile, not from here.
    "psycopg[binary]>=3.2",
    # Spaced-repetition scheduling. The published implementation rather than
    # one here: FSRS is a fitted model with published parameters, and the
    # failure mode of getting it subtly wrong is that somebody's schedule
    # decays for months before anyone can tell.
    "fsrs>=6.3",
    # Token verification. The `crypto` extra is the part that matters: without
    # it PyJWT can decode an RS256 token and cannot check its signature, which
    # fails open rather than closed.
    "pyjwt[crypto]>=2.9",
    # Fetching the auth provider's key set. Present transitively via anthropic,
    # declared here because this code imports it directly and a transitive
    # dependency is one somebody else can drop.
    "httpx>=0.28",
    # Schema migrations. Hand-written over raw SQL rather than autogenerated
    # from models: the schema carries comments explaining why each column
    # exists, and a model layer would either lose them or duplicate them.
    "alembic>=1.13",
    # Off-platform database backups to S3-compatible storage (Tigris on Fly).
    # boto3 rather than hand-rolled SigV4: signing is the part that is easy to
    # get subtly wrong and impossible to notice until a restore is needed.
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    # DEV ONLY. The official Anki package is AGPL-3.0-or-later; importing it
    # from application code would impose network copyleft on a public service.
    # It exists purely so tests can ask a real Anki what our .apkg actually did.
    # Pinned exactly: the contract tests characterise ONE version's import
    # behaviour, so the pin must move deliberately, never by resolution drift.
    "anki==26.8.1",
    # The datastore under the tests is a real Postgres in a container, not a
    # stand-in. A fake would let a query pass here that the real server rejects.
    "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
